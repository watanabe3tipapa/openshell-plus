[project]
name = "openshell-ui"
version = "0.1.0"
description = "Local-first and web-reachable UI/UX for NVIDIA OpenShell"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "websockets>=12",
]

[project.optional-dependencies]
openshell = ["openshell>=0.1.0"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openshell_ui"]

[tool.hatch.build.targets.sdist]
include = ["src/openshell_ui", "tests", "scripts", "policy", "deploy"]

[tool.vercel]
entrypoint = "openshell_ui.main:app"

[tool.vercel.fastapi.static]
cdn = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["deploy/colab/*.ipynb", "site/diagrams/*.html"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingImports = false
